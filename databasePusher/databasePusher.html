<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>database pusher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>database pusher</h1>

    <div class="container">
        <input type="file" id="file-upload" accept=".db" />
        <div class="dropdown-container">
            <label for="table-dropdown">select table:</label>
            <select id="table-dropdown">
                <option value="">select a table</option>
            </select>
        </div>

        <div id="input-fields-container"></div>

        <button id="insert-btn">insert row</button>
        <button id="save-btn">save changes</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="app.js"></script>
</body>
</html>
